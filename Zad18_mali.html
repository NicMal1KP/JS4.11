<!DOCTYPE html>   
<head>    
<title> Użycie fukcji </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
var c;
var d;
var e;
c=a*a
d=b*b
function suma_mal(a, b) { 
return a + b; 
} 
function odejmowanie_mal(a, b) { 
return a - b; 
} 
function mnozenie_mal(a, b) { 
return a * b; 
} 
function do_kwadratu_mal_a(a, b) { 
return c; 
} 
function do_kwadratu_mal_b(a, b) { 
return d; 
}
function reszta_z_dzielenia_a_przez_b_mal(a, b) { 
return a % b; 
} 
document.write("suma="+suma_mal(a,b)+"<br>");
document.write("odejmowanie="+odejmowanie_mal(a,b)+"<br>");
document.write("mnożenie="+mnozenie_mal(a,b)+"<br>"); 
document.write("kwadrat a="+do_kwadratu_mal_a(c)+"<br>");
document.write("kwadrat b="+do_kwadratu_mal_b(d)+"<br>");
document.write("reszta z dzielenia="+reszta_z_dzielenia_a_przez_b_mal(a,b)+"<br>");

</script> 
</div> 
</body> 
</html>
