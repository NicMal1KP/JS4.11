<!DOCTYPE html>   
<head>    
<title> proste obliczenia</title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
var liczba1=prompt("liczba1=",""); 
var liczba2=prompt("liczba2=","");  
var x1_mal=parseFloat(liczba1); 
var x2_mal=parseFloat(liczba2); 
x1_mal_rad=(Math.PI*x1_mal)/180;
x2_mal_rad=(Math.PI*x2_mal)/180;
y1_mal=3*Math.pow(x1_mal,(6/8));
y2_mal=2*Math.cos(x1_mal_rad)+3*Math.sin(x1_mal_rad);
y3_mal=Math.pow(Math.pow(x1_mal,5)+2*Math.pow(x2_mal,4),1/3)*Math.abs(x1_mal-x2_mal);
document.write("x1="+x1_mal+"&nbsp&nbsp&nbsp&nbsp&nbsp x2="+x2_mal+"<br>");  
document.write("x1_r="+x1_mal_rad.toFixed(2)+"&nbsp&nbsp&nbsp&nbsp&nbsp x2_r="+x2_mal_rad.toFixed(2)+"<br>"); 
document.write("y1="+y1_mal.toFixed(2)+"<br>"); 
document.write("y2="+y2_mal.toFixed(2)+"<br>"); 
document.write("y3="+y3_mal.toFixed(2)+"<br>");
</script> 
</div> 
</body> 
</html>
