<!DOCTYPE html>   
<head>    
<title> </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
  <script language="JavaScript"> 

      var liczba1 = prompt("N0=", "");
      var liczba2 = prompt("t=", "");
      var liczba3 = prompt("T1/2=", "");

      var N0_mal = parseFloat(liczba1);
      var t_mal = parseFloat(liczba2);
      var T_1_2_mal = parseFloat(liczba3);

      var lambda = Math.log(2) / T_1_2_mal;

      var N_mal = N0_mal * Math.pow(Math.E, -lambda * t_mal);

  
      document.write("N0=" + N0_mal.toFixed(2) + "[sztuk]<br>");
      document.write("t=" + t_mal.toFixed(2) + "[lat]<br>");
      document.write("T1/2=" + T_1_2_mal.toFixed(2) + "[lat]<br>");
      document.write("Lambda=" + lambda.toFixed(7) + "[1/rok]<br>");
      document.write("N=" + N_mal.toFixed(7) + "[sztuk]<br>");
  </script> 
</div> 
</body>
